<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园三维导览</title>
  <script src="libs/aframe.min.js"></script>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
    .topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
      background: rgba(13, 110, 253, 0.92); color: #fff;
      padding: 0.5rem 1rem; display: flex; align-items: center; gap: 1rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      font-family: "Microsoft YaHei", sans-serif;
    }
    .topbar a { color: #fff; text-decoration: none; font-weight: bold; }
    .topbar a:hover { text-decoration: underline; }
    .topbar .title { font-size: 1.05rem; }
    .topbar .hint { margin-left: auto; font-size: 0.8rem; opacity: 0.9; }
    a-scene { display: block; height: 100vh; }
  </style>
</head>
<body>
  <div class="topbar">
    <a href="../index.html">← 返回首页</a>
    <span class="title">🏫 校园三维导览</span>
    <span class="hint">拖动鼠标旋转视角 · 滚轮缩放</span>
  </div>

  <a-scene>
    <!-- 环境 -->
    <a-sky color="#aee3f7"></a-sky>
    <a-plane position="0 0 -4" rotation="-90 0 0" width="20" height="20" color="#7cb342"></a-plane>

    <!-- 主体：教学楼（方盒 + 屋顶） -->
    <a-box position="0 1.2 -6" width="4" height="2.4" depth="2" color="#efeeee"></a-box>
    <a-box position="0 2.7 -6" width="4.4" height="0.4" depth="2.4" color="#b71c1c"></a-box>

    <!-- 旗杆与旗帜（旗帜带飘扬动画） -->
    <a-cylinder position="3 1.8 -5" radius="0.05" height="3.6" color="#9e9e9e"></a-cylinder>
    <a-box position="3.35 3.3 -5" width="0.7" height="0.45" depth="0.03" color="#e53935"
           animation="property: position; to:3.4 3.3 -5; dir: alternate; dur: 900; loop: true"></a-box>

    <!-- 路灯：杆 + 发光球（点光源） -->
    <a-cylinder position="-3 1.2 -4" radius="0.06" height="2.4" color="#616161"></a-cylinder>
    <a-sphere position="-3 2.5 -4" radius="0.18" color="#fff59d"
              animation="property: scale; to: 1.3 1.3 1.3; dir: alternate; dur: 1200; loop: true"></a-sphere>
    <a-light type="point" position="-3 2.6 -4" color="#fff59d" intensity="0.6"></a-light>

    <!-- 环境光 -->
    <a-light type="ambient" color="#ffffff" intensity="0.7"></a-light>

    <!-- 相机初始位：稍远处平视校园 -->
    <a-camera position="0 1.8 2"></a-camera>
  </a-scene>
</body>
</html>

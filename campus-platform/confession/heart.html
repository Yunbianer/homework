<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>表白现场 · 爱心场景</title>
  <script src="libs/three.min.js"></script>
  <script src="libs/OrbitControls.js"></script>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: linear-gradient(135deg, #ffe4ec, #ffd6e7); }
    .topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
      background: rgba(233, 30, 99, 0.92); color: #fff;
      padding: 0.5rem 1rem; display: flex; align-items: center; gap: 1rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      font-family: "Microsoft YaHei", sans-serif;
    }
    .topbar a { color: #fff; text-decoration: none; font-weight: bold; }
    .topbar a:hover { text-decoration: underline; }
    .topbar .title { font-size: 1.05rem; }
    .topbar .hint { margin-left: auto; font-size: 0.8rem; opacity: 0.9; }
    #heart3d { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <div class="topbar">
    <a href="index.html">← 返回表白现场</a>
    <span class="title">❤ 爱心场景</span>
    <span class="hint">拖动鼠标旋转视角 · 滚轮缩放</span>
  </div>

  <div id="heart3d"></div>

  <script>
    (function () {
      const container = document.getElementById('heart3d');
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 20, 150);
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      container.appendChild(renderer.domElement);

      // 爱心形状（简单挤出成型）
      const shape = new THREE.Shape();
      const x = 0, y = 0;
      shape.moveTo(x + 25, y + 25);
      shape.bezierCurveTo(x + 25, y + 25, x + 20, y, x, y);
      shape.bezierCurveTo(x - 30, y, x - 30, y + 35, x - 30, y + 35);
      shape.bezierCurveTo(x - 30, y + 55, x - 10, y + 77, x + 25, y + 95);
      shape.bezierCurveTo(x + 60, y + 77, x + 80, y + 55, x + 80, y + 35);
      shape.bezierCurveTo(x + 80, y + 35, x + 80, y, x + 50, y);
      shape.bezierCurveTo(x + 35, y, x + 25, y + 25, x + 25, y + 25);

      const geo = new THREE.ExtrudeGeometry(shape, {
        depth: 16, bevelEnabled: true, bevelThickness: 5, bevelSize: 5, bevelSegments: 4
      });
      geo.center();
      const mat = new THREE.MeshStandardMaterial({ color: 0xff4f81, metalness: 0.15, roughness: 0.3 });
      const heart = new THREE.Mesh(geo, mat);
      heart.rotation.z = Math.PI; // 尖端朝下
      scene.add(heart);

      scene.add(new THREE.AmbientLight(0xffffff, 0.95));
      const dir = new THREE.DirectionalLight(0xffffff, 1.2);
      dir.position.set(30, 50, 70);
      scene.add(dir);

      // —— 点缀 1：地面 ——
      const ground = new THREE.Mesh(
        new THREE.CircleGeometry(140, 48),
        new THREE.MeshStandardMaterial({ color: 0xffd6e7, roughness: 0.95 })
      );
      ground.rotation.x = -Math.PI / 2;
      ground.position.y = -58;
      scene.add(ground);

      // —— 点缀 2：环绕的小爱心 ——
      const miniGeo = new THREE.ExtrudeGeometry(shape, {
        depth: 8, bevelEnabled: true, bevelThickness: 3, bevelSize: 3, bevelSegments: 2
      });
      miniGeo.center();
      const orbiters = [];
      const colors = [0xff8fab, 0xff6f91, 0xff4f81, 0xffc1d4, 0xff3d7a];
      for (let i = 0; i < 5; i++) {
        const m = new THREE.Mesh(miniGeo, new THREE.MeshStandardMaterial({ color: colors[i], roughness: 0.4 }));
        m.scale.setScalar(0.16);
        m.userData = { radius: 52 + i * 9, speed: 0.22 + i * 0.05, height: 8 + (i % 3) * 16, phase: i };
        orbiters.push(m);
        scene.add(m);
      }

      // —— 点缀 3：飘浮闪光点 ——
      const sparkCount = 90;
      const sparkPos = new Float32Array(sparkCount * 3);
      for (let i = 0; i < sparkCount; i++) {
        sparkPos[i * 3]     = (Math.random() - 0.5) * 240;
        sparkPos[i * 3 + 1] = (Math.random() - 0.5) * 170;
        sparkPos[i * 3 + 2] = (Math.random() - 0.5) * 240;
      }
      const sparkGeo = new THREE.BufferGeometry();
      sparkGeo.setAttribute('position', new THREE.BufferAttribute(sparkPos, 3));
      const sparks = new THREE.Points(sparkGeo, new THREE.PointsMaterial({
        color: 0xffffff, size: 2.4, transparent: true, opacity: 0.85
      }));
      scene.add(sparks);

      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableZoom = true;

      function tick() {
        requestAnimationFrame(tick);
        const t = Date.now() / 1000;
        heart.rotation.y += 0.008;
        heart.position.y = Math.sin(t) * 3; // 轻微上下浮动
        // 小爱心环绕 + 上下浮动
        orbiters.forEach((m, i) => {
          const u = m.userData;
          const a = t * u.speed + u.phase;
          m.position.set(Math.cos(a) * u.radius, u.height + Math.sin(t * 1.5 + i) * 6, Math.sin(a) * u.radius);
          m.rotation.z = Math.PI;
          m.rotation.y = a;
        });
        sparks.rotation.y += 0.0006; // 闪光点缓慢漂移
        controls.update();
        renderer.render(scene, camera);
      }
      tick();

      window.addEventListener('resize', function () {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    })();
  </script>
</body>
</html>

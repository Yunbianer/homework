<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>表白现场 ❤</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #ffe4ec 0%, #fff0f5 50%, #ffd6e7 100%);
    color: #c2185b; min-height: 100vh;
  }
  header {
    text-align: center; padding: 32px 16px 8px;
  }
  header h1 { font-size: 2.2rem; letter-spacing: 2px; }
  header p { margin-top: 8px; color: #e91e63; opacity: .85; }
  .back { display:inline-block; margin-top:12px; color:#c2185b; text-decoration:none; font-size:.9rem; }
  .back:hover { text-decoration: underline; }

  #enterBtn {
    display: inline-block; font-size: 1.25rem; font-weight: 700;
    padding: 16px 44px; border-radius: 999px; color: #fff; text-decoration: none;
    background: linear-gradient(135deg,#ff6f91,#ff4f81);
    box-shadow: 0 6px 18px rgba(255,79,129,.45); transition: transform .15s;
  }
  #enterBtn:hover { transform: scale(1.06); }
  #enterBtn:active { transform: scale(.95); }

  .actions { text-align: center; margin: 20px 0 10px; }
  #loveBtn {
    font-size: 1.1rem; padding: 12px 32px; border: none; border-radius: 999px;
    background: linear-gradient(135deg,#ff6f91,#ff4f81); color: #fff; cursor: pointer;
    box-shadow: 0 4px 14px rgba(255,79,129,.4); transition: transform .15s;
  }
  #loveBtn:hover { transform: scale(1.05); }
  #loveBtn:active { transform: scale(.95); }
  #counter { margin-top: 10px; font-size: 1.05rem; }

  .message {
    text-align: center; min-height: 28px; margin: 8px 0 20px;
    font-size: 1.15rem; color: #d81b60; font-weight: 600;
  }

  .chart-box {
    width: 90%; max-width: 720px; margin: 0 auto 40px;
    background: rgba(255,255,255,.55); border-radius: 18px;
    box-shadow: 0 6px 20px rgba(233,30,99,.15); padding: 16px;
  }
  .chart-box h3 { margin-bottom: 8px; font-size: 1.05rem; }
  #chart { width: 100%; height: 240px; }
  .chart-fail { color: #e53935; font-size: .9rem; }
</style>
</head>
<body>
  <header>
    <h1>表白现场 ❤</h1>
    <p>有些话，想说很久了——这是一个小小的心意展示</p>
    <a class="back" href="../index.html">← 返回整合首页</a>
  </header>

  <div class="entry" style="text-align:center; margin: 24px auto;">
    <a href="heart.html" id="enterBtn">进入爱心场景 ❤</a>
  </div>

  <div class="actions">
    <button id="loveBtn">点我表白 ❤</button>
    <div id="counter">已收到 0 份心意</div>
  </div>
  <div class="message" id="message">点击按钮，让这份心意被看见 💕</div>

  <div class="chart-box">
    <h3>几句情话的心动指数（示意数据）</h3>
    <div id="chart"></div>
  </div>

  <script>
    /* ---------- 互动：点我表白 ---------- */
    (function () {
      let count = 0;
      const msgs = ['我喜欢你，从遇见你的那天起 💕', '愿意做我最特别的人吗？🌹', '这颗心，送给你 ❤', '往后余生，请多指教 ✨'];
      const btn = document.getElementById('loveBtn');
      const counter = document.getElementById('counter');
      const message = document.getElementById('message');
      btn.addEventListener('click', function () {
        count++;
        counter.textContent = '已收到 ' + count + ' 份心意';
        message.textContent = msgs[(count - 1) % msgs.length];
        // 按钮动画
        btn.style.transform = 'scale(1.15)';
        setTimeout(function () { btn.style.transform = ''; }, 150);
      });
    })();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <script>
    /* ---------- 迷你图表：心动指数 ---------- */
    (function () {
      if (typeof echarts === 'undefined') {
        document.getElementById('chart').innerHTML =
          '<div class="chart-fail">图表库加载失败（可能未联网），其余功能不受影响。</div>';
        return;
      }
      const chart = echarts.init(document.getElementById('chart'));
      chart.setOption({
        tooltip: { trigger: 'axis' },
        grid: { left: 50, right: 20, top: 30, bottom: 40 },
        xAxis: { type: 'category', data: ['我喜欢你', '做我女/男朋友吧', '余生请多指教', '这颗心送你'] },
        yAxis: { type: 'value', name: '心动指数' },
        series: [{
          type: 'bar',
          data: [88, 95, 90, 99],
          itemStyle: { color: '#ff6f91', borderRadius: [6, 6, 0, 0] },
          label: { show: true, position: 'top' }
        }]
      });
      window.addEventListener('resize', function () { chart.resize(); });
    })();
  </script>
</body>
</html>
